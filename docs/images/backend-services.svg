      <line x1="80" y1="328" x2="80" y2="408" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="88" y="360" width="48" height="12" rx="2" fill="#F6F3EC"/>
      <text x="112" y="368" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FN CALL</text>

