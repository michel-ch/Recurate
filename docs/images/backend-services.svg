<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-services-title backend-services-desc">
      <title id="backend-services-title">Recurate services</title>
      <desc id="backend-services-desc">Architecture diagram showing ui::App driving PlaybackController, Engine, SearchWorker, DownloadWorker, Library and renumberer, with yt-dlp / ffmpeg and the YouTube Data API v3 as external dependencies.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B6356"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B3502F"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C6B3F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F6F3EC"/>

      <!-- Zone: external processes / network -->
      <rect x="760" y="152" width="176" height="224" rx="8" fill="#33302a" fill-opacity="0.02" stroke="#33302a" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="812" y="156" width="72" height="12" rx="2" fill="#F6F3EC"/>
      <text x="848" y="164" fill="#33302a" fill-opacity="0.40" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

      <!-- Arrows (drawn before boxes) -->
      <!-- E1 ui::App -> PlaybackController (fn call) -->
      <path d="M112,168 V112 Q112,104 120,104 H288" fill="none" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="180" y="84" width="48" height="12" rx="2" fill="#F6F3EC"/>
      <text x="204" y="92" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FN CALL</text>

      <!-- E2 PlaybackController -> Engine (crossbeam EngineCmd) -->
      <line x1="448" y1="96" x2="544" y2="96" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="460" y="76" width="72" height="12" rx="2" fill="#F6F3EC"/>
      <text x="496" y="84" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSSBEAM CMD</text>

      <!-- E3 Engine -> PlaybackController (crossbeam EngineEvent, return) -->
      <line x1="544" y1="112" x2="448" y2="112" stroke="#6B6356" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="460" y="120" width="72" height="12" rx="2" fill="#F6F3EC"/>
      <text x="496" y="128" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSSBEAM EVT</text>

      <!-- E4 ui::App -> SearchWorker (crossbeam SearchRequest) -->
      <line x1="192" y1="216" x2="288" y2="216" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="212" y="196" width="56" height="12" rx="2" fill="#F6F3EC"/>
      <text x="240" y="204" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSSBEAM</text>

      <!-- E5 ui::App -> DownloadWorker (crossbeam DownloadRequest) -->
      <line x1="192" y1="312" x2="288" y2="312" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="212" y="292" width="56" height="12" rx="2" fill="#F6F3EC"/>
      <text x="240" y="300" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSSBEAM</text>

