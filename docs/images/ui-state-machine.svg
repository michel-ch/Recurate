<text x="160" y="244" fill="#33302A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Idle</text>
<text x="160" y="260" fill="#6B6356" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">no batch in flight</text>
<rect x="320" y="200" width="128" height="80" rx="8" fill="#F6F3EC"/>
<rect x="320" y="200" width="128" height="80" rx="8" fill="#ffffff" stroke="#33302A" stroke-width="1"/>
<rect x="328" y="208" width="40" height="12" rx="2" fill="none" stroke="#33302a" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="348" y="217" fill="#33302A" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
<text x="384" y="244" fill="#33302A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolving</text>
<text x="384" y="260" fill="#6B6356" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">ResolveJob.running</text>
<rect x="544" y="200" width="128" height="80" rx="8" fill="#F6F3EC"/>
<rect x="544" y="200" width="128" height="80" rx="8" fill="#b3502f" fill-opacity="0.08" stroke="#B3502F" stroke-width="1"/>
<rect x="552" y="208" width="40" height="12" rx="2" fill="none" stroke="#b3502f" stroke-opacity="0.50" stroke-width="0.8"/>
<text x="572" y="217" fill="#B3502F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
<text x="608" y="244" fill="#33302A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PendingPrompt</text>
<text x="608" y="260" fill="#6B6356" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">pending_batch set</text>
<rect x="768" y="200" width="128" height="80" rx="8" fill="#F6F3EC"/>
<rect x="768" y="200" width="128" height="80" rx="8" fill="#ffffff" stroke="#33302A" stroke-width="1"/>
<rect x="776" y="208" width="40" height="12" rx="2" fill="none" stroke="#33302a" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="796" y="217" fill="#33302A" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
<text x="832" y="244" fill="#33302A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Downloading</text>
<text x="832" y="260" fill="#6B6356" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">queued_ids · Pending</text>
<text x="920" y="412" fill="#6B6356" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Pause / Resume on the DownloadWorker keeps the batch in Downloading — it is not a transition.</text>
<line x1="40" y1="432" x2="920" y2="432" stroke="#33302a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="40" y="448" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="460" width="16" height="10" rx="2" fill="#ffffff" stroke="#33302A" stroke-width="1"/>
<text x="64" y="468" fill="#6B6356" font-size="8" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">Batch state</text>
<rect x="168" y="460" width="16" height="10" rx="2" fill="#b3502f" fill-opacity="0.08" stroke="#B3502F" stroke-width="1"/>
<text x="192" y="468" fill="#6B6356" font-size="8" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">Focal: user must answer the prompt</text>
<line x1="392" y1="464" x2="408" y2="464" stroke="#6B6356" stroke-width="1" marker-end="url(#arrow)"/>
<text x="416" y="468" fill="#6B6356" font-size="8" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">Transition · event</text>
<line x1="552" y1="464" x2="568" y2="464" stroke="#6B6356" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="576" y="468" fill="#6B6356" font-size="8" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">Dashed: cancel path</text>

