      <title id="user-journey-title">Recurate user journey</title>
      <desc id="user-journey-desc">User journey map across six stages, from launching the player through browsing, listening, curating, acquiring new audio, and settings, with sentiment dipping at Browse and lowest at Acquire where the yt-dlp bot wall forces a cookies setting.</desc>
