      <line x1="368" y1="360" x2="368" y2="408" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="376" y="376" width="64" height="12" rx="2" fill="#F6F3EC"/>
      <text x="408" y="384" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ARC&lt;RWLOCK&gt;</text>

