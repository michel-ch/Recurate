      <rect x="580" y="324" width="64" height="12" rx="2" fill="#F6F3EC"/>
      <text x="612" y="332" fill="#5C6B3F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBPROCESS</text>

