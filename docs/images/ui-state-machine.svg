<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ui-state-machine-title ui-state-machine-desc">
      <title id="ui-state-machine-title">Recurate Playlists batch state machine</title>
      <desc id="ui-state-machine-desc">State machine of the Playlists add-songs batch: Idle goes to Resolving on Find and download, then either to Downloading, to PendingPrompt when duplicates are found, or back to Idle when every line failed; the prompt leads to Downloading or cancels to Idle, and Downloading returns to Idle once no download is pending and the folder is renumbered.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B6356"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B3502F"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C6B3F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F6F3EC"/>
<line x1="56" y1="240" x2="96" y2="240" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="224" y1="232" x2="320" y2="232" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="448" y1="232" x2="544" y2="232" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="672" y1="232" x2="768" y2="232" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 384 200 L 384 144 Q 384 136 392 136 L 824 136 Q 832 136 832 144 L 832 200" fill="none" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 384 280 L 384 312 Q 384 320 376 320 L 200 320 Q 192 320 192 312 L 192 280" fill="none" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 608 280 L 608 344 Q 608 352 600 352 L 168 352 Q 160 352 160 344 L 160 280" fill="none" stroke="#6B6356" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 832 280 L 832 376 Q 832 384 824 384 L 136 384 Q 128 384 128 376 L 128 280" fill="none" stroke="#6B6356" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="228" y="200" width="88" height="12" rx="2" fill="#F6F3EC"/>
<text x="272" y="210" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FIND &amp; DOWNLOAD</text>
<rect x="450" y="200" width="92" height="12" rx="2" fill="#F6F3EC"/>
<text x="496" y="210" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DUPLICATES FOUND</text>
<rect x="674" y="200" width="92" height="24" rx="2" fill="#F6F3EC"/>
<text x="720" y="210" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SKIP DUPLICATES /</text>
<text x="720" y="222" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DOWNLOAD ANYWAY</text>
<rect x="528" y="116" width="160" height="12" rx="2" fill="#F6F3EC"/>
<text x="608" y="126" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ALL RESOLVED · NO DUPLICATES</text>
<rect x="242" y="300" width="92" height="12" rx="2" fill="#F6F3EC"/>
<text x="288" y="310" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ALL LINES FAILED</text>
<rect x="360" y="332" width="48" height="12" rx="2" fill="#F6F3EC"/>
<text x="384" y="342" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CANCEL</text>
<rect x="388" y="364" width="184" height="12" rx="2" fill="#F6F3EC"/>
<text x="480" y="374" fill="#6B6356" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NO PENDING LEFT → RENUMBER_FOLDER</text>
<circle cx="48" cy="240" r="6" fill="#33302A"/>
<rect x="96" y="200" width="128" height="80" rx="8" fill="#F6F3EC"/>
