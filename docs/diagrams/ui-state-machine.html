<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #F6F3EC;
      --color-ink: #33302A;
      --color-muted: #6B6356;
      --color-accent: #B3502F;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 0.5rem; }
    .subtitle { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; max-width: 60ch; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Recurate</p>
    <h1>Playlists “Find &amp; download” batch</h1>
    <p class="subtitle">How one paste of links or titles moves through resolving, an optional duplicate prompt, and downloading before the folder is renumbered.</p>

    <svg viewBox="0 0 960 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ui-state-machine-title ui-state-machine-desc">
      <title id="ui-state-machine-title">Recurate Playlists batch state machine</title>
      <desc id="ui-state-machine-desc">State machine of the Playlists add-songs batch: Idle goes to Resolving on Find and download, then either to Downloading, to PendingPrompt when duplicates are found, or back to Idle when every line failed; the prompt leads to Downloading or cancels to Idle, and Downloading returns to Idle once no download is pending and the folder is renumbered.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C6B3F"/></marker>
      </defs>

<text x="920" y="412" fill="#6B6356" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Pause / Resume on the DownloadWorker keeps the batch in Downloading — it is not a transition.</text>
